apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: finops-ingress
  namespace: finops
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # Frontend — /ssh-gcp-costing/
          - path: /ssh-gcp-costing(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: finops-frontend
                port:
                  number: 80
          # Backend API — /ssh-gcp-costing-backend/
          - path: /ssh-gcp-costing-backend(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: finops-backend
                port:
                  number: 9006
