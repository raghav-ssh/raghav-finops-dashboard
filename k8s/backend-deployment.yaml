apiVersion: apps/v1
kind: Deployment
metadata:
  name: finops-backend
  namespace: finops
  labels:
    app: finops-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finops-backend
  template:
    metadata:
      labels:
        app: finops-backend
    spec:
      containers:
        - name: finops-backend
          image: asia-south1-docker.pkg.dev/ssh-marine/finops-reports/finops-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9006
          envFrom:
            - secretRef:
                name: finops-env
          volumeMounts:
            - name: gcp-sa
              mountPath: /app/credentials
              readOnly: true
            - name: outputs
              mountPath: /app/outputs
          livenessProbe:
            httpGet:
              path: /health
              port: 9006
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 9006
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      volumes:
        - name: gcp-sa
          secret:
            secretName: gcp-sa-key
        - name: outputs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: finops-backend
  namespace: finops
spec:
  selector:
    app: finops-backend
  ports:
    - port: 9006
      targetPort: 9006
  type: ClusterIP
