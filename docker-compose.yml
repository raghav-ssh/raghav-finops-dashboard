services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finops-backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./outputs:/app/outputs
      - ./credentials/gcp-sa.json:/app/credentials/gcp-sa.json:ro
    ports:
      - "9006:9006"  # internal only, kept for direct access if needed
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: finops-frontend
    restart: unless-stopped
    ports:
      - "9010:80"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro

volumes:
  outputs:
